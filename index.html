<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violet Renard</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/59a5f48017.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="splash-container">
      <h1 id="splash-1">
        Hi, I'm<br />
        <span id="splash-2">Violet</span>
      </h1>

      <img
        src="assets/selfie.jpg"
        id="splash-picture"
        alt="Headshot of Violet Renard"
      />
    </div>

    <div id="scroll-marker">
      <p>Scroll down for more</p>
      <i id="scroll-bouncer" class="fa-solid fa-angle-down"></i>
    </div>

    <h2>About me</h2>

    <footer>
      <a href="https://www.linkedin.com/in/chris-bao-psych-cs/">
        <i class="fa-brands fa-square-linkedin social-link"></i>
      </a>
      <a href="https://github.com/lucien-bao">
        <i class="fa-brands fa-square-github social-link"></i>
      </a>
      <a href="https://www.instagram.com/violet.lovelace.renard">
        <i class="fa-brands fa-square-instagram social-link"></i>
      </a>
      <p>ⓒ Violet Renard 2026</p>
    </footer>
  </body>
  <script>
    function scrollHandler() {
      // Only update after we know the fade-in animation is done.
      if ((Date.now() - performance.timeOrigin) < 1000) return;

      const marker = document.getElementById("scroll-marker");
      marker.style.opacity = (window.scrollY > 1) ? 0 : 1;
    }

    document.addEventListener("scroll", scrollHandler);
  </script>
</html>
