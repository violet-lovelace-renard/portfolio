<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found</title>
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/59a5f48017.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <h1>404</h1>
    <p>Oops! There isn't a page here, or maybe it was moved somewhere else.</p>
    <button id="back-to-home">
        Back to home
    </button>
  </body>
  <script>
    document.getElementById("back-to-home")
            .addEventListener("click", (e) => {
              window.location.href = "/index.html"
            })
  </script>
</html>
